; Turboelectric Reactor Unlock + Power Fix — per-mod settings.
; Installed to <game>/mods/config/org.cdere.turboelectric.ini
; The installer never overwrites an existing copy, so edit this freely.
[mod]

; 1 = expose the hidden TurboelectricFissionReactorModule in Module Design
;     (patches only that class's IsEnabled vtable slot, nothing else).
; 0 = leave the stock game unchanged (the module stays hidden).
unlock = 1

; Frames to wait before IsEnabled starts returning 1 (0 = immediately).
unlock_after_frames = 0

; Blackbox model: keep the reactor's fission heat and replace the broken
; turbine/pump loop with P = Q * (1 - Tc/Th) * carnot_fraction.
; 1 = use the blackbox model (recommended for the hidden module)
; 0 = use the stock formulas (optionally clamped by clamp_power below)
blackbox = 1

; EXPERIMENTAL: correct the pump's Euler torque to zero inlet swirl.
; Tested 2026-10-18: the stock torque is already positive for the test design
; (+0.13 N m); this correction gives +0.065 N m, so it is NOT the source of the
; Mach/temperature anomaly. Leave 0 unless experimenting.
fix_pump = 0

; EXPERIMENTAL: force the area-Mach solver to the subsonic root. This hooks the
; global CompressibleFlowPoint, so it also affects supersonic nozzles.
; 0 = off; 1 = test (useful for the turbo loop diagram).
fix_mach = 0

; Fraction of the ideal Carnot efficiency the blackbox model delivers (0..1).
; 0.70 = 70% of the Carnot limit.
carnot_fraction = 0.70

; Only used when blackbox = 0:
; 1 = clamp net power to the Carnot limit: Pmax = Q * (1 - Tc/Th)
; 0 = leave the stock power calculation untouched (useful for comparison).
clamp_power = 1

; 1 = log the first clamp (with values) and a session total at exit;
; 0 = keep the log completely silent about clamps.
log_clamps = 1

; 1 = run a one-line self-test at init (writes to cdeloader.log).
selftest = 0
